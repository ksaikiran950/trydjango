{% extends 'base.html '%}

{% block content %}
{% block title %}All Posts{% endblock %}
<a href="/create/">+ Create New</a>
<ul>
  {% for post in posts %}
    <li>
      <a href="/{{ post.id }}/">{{ post.title }}</a>
      (<a href="/{{ post.id }}/update/">Edit</a>,
       <a href="/{{ post.id }}/delete/">Delete</a>)
    </li>
  {% endfor %}
</ul>
{% endblock %}
